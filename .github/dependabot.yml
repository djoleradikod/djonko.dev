# Weekly dependency updates as pull requests. Each PR runs the full build and audit in CI,
# and Cloudflare Pages builds a protected preview of it, before anything reaches main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # Major versions (Astro, Mermaid, Satori) change APIs and output. They are upgraded on purpose,
    # in their own branch with a full visual check, not through weekly PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # 0.x packages break on minor versions; Satori changes how share images render.
      - dependency-name: 'satori'
        update-types: ['version-update:semver-minor']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      build-tools:
        patterns: ['pagefind', 'sharp', 'satori', '@resvg/*', 'mermaid', '@fontsource/*', 'axe-core']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
