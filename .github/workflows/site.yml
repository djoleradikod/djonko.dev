# Build, check and deploy djonko.dev.
# Pull requests: build and run every check. Pushes to main: also deploy to the targets switched on in
# Settings > Secrets and variables > Actions > Variables:
#   DEPLOY_HETZNER = true   needs secrets HETZNER_HOST (deploy@<ip>), HETZNER_SSH_KEY (private key), HETZNER_KNOWN_HOSTS
#   DEPLOY_PAGES   = true   needs secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#                           Leave it unset while the Pages project is connected to this repository
#                           (Cloudflare Git integration): Cloudflare then builds and deploys every push
#                           itself, and a second deploy from here would race it. This workflow stays as
#                           the gate: build, privacy scan, link check and audit on every PR and push.
#   DEPLOY_BLACKNIGHT = true  needs secrets BN_HOST, BN_USER, BN_PASS and variable BN_DIR (e.g. public_html)
# Optional variables: SITE_URL, PUBLIC_MEDIA_URL, PUBLIC_NOINDEX, PUBLIC_CF_ANALYTICS_TOKEN, PUBLIC_PLAUSIBLE_DOMAIN.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # weekly: refresh project.json from tool releases and re-check external state

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL }}
  PUBLIC_MEDIA_URL: ${{ vars.PUBLIC_MEDIA_URL }}
  PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX }}
  PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
  PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh tool facts from GitHub releases
        run: npm run sync:projects
      - name: Build (includes privacy scan and link check)
        run: npm run build
      - name: Accessibility, CSP and page-weight audit
        run: |
          npx playwright install --with-deps chromium   # version pinned in package.json
          npm run audit
      - name: Validate the Caddy config
        run: docker run --rm -v "$PWD/deploy/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Weekly, and on demand: every external link in the site (sources, KBs, the tools catalogue) still resolves.
  # Kept out of PR checks because third-party sites fail for reasons unrelated to the change.
  external-links:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Check external links
        run: node scripts/check-external.mjs

  deploy-hetzner:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_HETZNER == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: SSH key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.HETZNER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DOMAIN: ${{ vars.DOMAIN || 'djonko.dev' }}
        run: deploy/hetzner/deploy.sh --skip-build

  deploy-pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=djonko-dev --branch=main

  deploy-blacknight:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_BLACKNIGHT == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: sudo apt-get install -y -q lftp
      - name: Upload over SFTP
        env:
          BN_HOST: ${{ secrets.BN_HOST }}
          BN_USER: ${{ secrets.BN_USER }}
          BN_PASS: ${{ secrets.BN_PASS }}
          BN_DIR: ${{ vars.BN_DIR || 'public_html' }}
          BN_PROTO: ${{ vars.BN_PROTO || 'sftp' }}
        run: deploy/blacknight/deploy.sh --skip-build
