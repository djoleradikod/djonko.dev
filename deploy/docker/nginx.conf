server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers suitable for a static site
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

  # Long cache for fingerprinted assets, short for pages
  location /_astro/   { expires 1y; add_header Cache-Control "public, immutable"; }
  location /pagefind/ { expires 1h; }
  location / {
    try_files $uri $uri/ $uri/index.html =404;
    expires 10m;
  }
  error_page 404 /404.html;
}
