# Run on the home server: docker compose -f deploy/docker/docker-compose.yml up -d --build
services:
  vcf-field-notes:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://djonko.dev}
        PUBLIC_NOINDEX: ${PUBLIC_NOINDEX:-}
    image: vcf-field-notes:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # only local; publish through Caddy or a tunnel

  # Optional: public exposure without opening router ports.
  # Create a tunnel in the Cloudflare dashboard, map your hostname to http://vcf-field-notes:8080,
  # put its token in deploy/.env as TUNNEL_TOKEN, then: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2024.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [vcf-field-notes]
